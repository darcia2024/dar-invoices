<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>DAR INVOICES | Masuk</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png">
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#eae5d8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DAR">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash-1179x2556.png">
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash-1206x2622.png">
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/brand/splash-1290x2796.png">
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function () {});</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Sora', sans-serif; background: #eae5d8; color: #292923;
            min-height: 100dvh; display: grid; place-items: center; padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .cover-card {
            width: 100%; max-width: 440px; background: #faf8ee; border: 1px solid #ddd5c5;
            padding: 44px; border-radius: 22px; box-shadow: 0 22px 80px #65583b18;
        }
        .cover-top-barcode { color: #666256; font-size: 11px; font-weight: 600; margin-bottom: 35px; text-transform: uppercase; }
        .cover-top-barcode { display: flex; align-items: center; gap: 12px; }
        .login-mascot { width: 64px; height: 64px; display: block; }
        .classified-stamp { display: inline-block; background: #dbc4ee; color: #513862; padding: 7px 10px; font-size: 10px; font-weight: 600; border-radius: 6px; margin-bottom: 20px; }
        .cover-title { font-size: 32px; font-weight: 500; letter-spacing: -1.4px; line-height: 1.25; margin-bottom: 16px; }
        .cover-subtitle { color: #625d50; font-size: 12px; line-height: 1.8; }
        .divider { border-top: 1px solid #d9d1c0; margin: 24px 0; }
        .passcode-label { display: block; color: #5c574a; font-size: 11px; font-weight: 600; margin-bottom: 10px; }
        .passcode-input {
            width: 100%; color: #252520; background: #fffdf6; border: 1px solid #bdb3a0; border-radius: 8px;
            font: 500 16px 'Sora', sans-serif; letter-spacing: 2px; padding: 14px 16px; outline: none;
        }
        .passcode-input:focus { border-color: #43473b; }
        .passcode-input::placeholder { font-size: 12px; letter-spacing: 0; }
        .passcode-error { color: #9c3529; font-size: 11px; margin-top: 8px; min-height: 16px; }
        .cover-open-btn {
            margin-top: 16px; width: 100%; background: #292b24; color: #fffdf3; border: 0; border-radius: 8px;
            font: 600 12px 'Sora', sans-serif; padding: 15px; cursor: pointer; transition: background .2s;
        }
        .cover-open-btn:hover { background: #43473b; }
        .cover-open-btn:disabled { opacity: .6; cursor: wait; }
        .shake { animation: shake .35s ease; }
        @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        @media (max-width: 600px) { .cover-card { padding: 30px 24px; } .cover-title { font-size: 26px; } }
    </style>
</head>
<body>
    <form class="cover-card" id="loginForm" autocomplete="on">
        <div class="cover-top-barcode"><img class="login-mascot" src="/brand/dar-mascot-256.png" alt="Maskot DAR" width="64" height="64"><span>DAR / Workspace</span></div>
        <div class="classified-stamp">Keuangan agency</div>
        <h1 class="cover-title">Semua invoice.<br>Satu ruang kerja.</h1>
        <p class="cover-subtitle">Masuk untuk mengelola tagihan dan melihat pendapatan agency.</p>
        <div class="divider"></div>
        <label for="pin" class="passcode-label">PIN akses</label>
        <input type="password" id="pin" name="pin" class="passcode-input" inputmode="numeric" autocomplete="current-password" maxlength="32" placeholder="Masukkan PIN" required autofocus>
        <div id="error" class="passcode-error" role="alert"></div>
        <button type="submit" class="cover-open-btn" id="submitBtn">Buka dashboard keuangan</button>
    </form>

    <script>
        const form = document.getElementById('loginForm');
        const input = document.getElementById('pin');
        const errorEl = document.getElementById('error');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorEl.textContent = '';
            btn.disabled = true;
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: input.value.trim() }),
                    credentials: 'same-origin',
                });
                if (response.ok) {
                    window.location.replace('/dar');
                    return;
                }
                const data = await response.json().catch(() => ({}));
                errorEl.textContent = data.error || 'PIN belum sesuai. Coba lagi.';
                input.value = '';
                form.classList.remove('shake');
                void form.offsetWidth;
                form.classList.add('shake');
            } catch (e) {
                errorEl.textContent = 'Koneksi gagal. Coba lagi.';
            } finally {
                btn.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
